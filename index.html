<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalidades del Grupo</title>
<style>
  :root{
    --bg:#0f1020;
    --bg2:#171833;
    --card:#1c1d3a;
    --card2:#232451;
    --text:#eef0ff;
    --muted:#9aa0c7;
    --analistas:#9b6fb8;
    --diplomaticos:#3fb98a;
    --centinelas:#4aa8c8;
    --exploradores:#e9b84a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#2a2b5a 0%,transparent 60%),
               radial-gradient(1000px 500px at 100% 0%,#1e3d4d 0%,transparent 55%),
               var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{text-align:center;margin:10px 0 26px}
  h1{
    font-size:clamp(26px,6vw,40px);
    font-weight:800;
    letter-spacing:-.5px;
    background:linear-gradient(90deg,#c7a4ff,#7ee0c0,#7fd0ee,#f2cf7a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);margin-top:8px;font-size:15px}

  .controls{
    display:flex;flex-direction:column;gap:14px;margin-bottom:24px;
  }
  .search{
    position:relative;
  }
  .search input{
    width:100%;padding:15px 16px 15px 46px;border-radius:14px;border:1px solid #33356b;
    background:var(--bg2);color:var(--text);font-size:16px;outline:none;
    transition:border .2s,box-shadow .2s;
  }
  .search input:focus{border-color:#7c7ff0;box-shadow:0 0 0 4px rgba(124,127,240,.18)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.6}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{
    padding:8px 15px;border-radius:999px;border:1px solid #35376e;background:var(--bg2);
    color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
    user-select:none;
  }
  .chip:hover{color:var(--text);border-color:#5b5ea0}
  .chip.active{color:#0f1020;border-color:transparent}
  .chip[data-g="all"].active{background:#c9cdf5;color:#161634}
  .chip[data-g="Analistas"].active{background:var(--analistas)}
  .chip[data-g="Diplomáticos"].active{background:var(--diplomaticos)}
  .chip[data-g="Centinelas"].active{background:var(--centinelas)}
  .chip[data-g="Exploradores"].active{background:var(--exploradores)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{
    background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid #2c2e5e;border-radius:18px;padding:16px 12px 14px;text-align:center;
    cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
    position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4);border-color:var(--accent)}
  .avatar{width:88px;height:88px;margin:6px auto 10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
  .avatar svg,.m-avatar svg{width:100%;height:100%;display:block}
  .avatar-photo{width:84px;height:94px;margin:3px auto 10px;object-fit:cover;border-radius:15px;border:2.5px solid var(--accent);display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
  .m-avatar-photo{width:104px;height:118px;flex:none;object-fit:cover;border-radius:15px;border:2.5px solid var(--accent)}
  .card .name{font-weight:700;font-size:17px}
  .card .type{color:var(--muted);font-size:13px;margin-top:2px}
  .badge{
    display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.5px;
    padding:3px 9px;border-radius:999px;color:#0f1020;background:var(--accent);
  }
  .empty{text-align:center;color:var(--muted);padding:50px 0;grid-column:1/-1}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(6,7,18,.72);backdrop-filter:blur(6px);
    display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;
    overflow-y:auto;
  }
  .overlay.open{display:flex}
  .modal{
    background:linear-gradient(160deg,var(--card),#191a38);border:1px solid #34366e;
    border-radius:22px;max-width:520px;width:100%;padding:26px 22px 28px;position:relative;
    animation:pop .22s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .close{
    position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    background:#2a2c58;border:none;color:var(--text);font-size:18px;cursor:pointer;line-height:1;
  }
  .close:hover{background:#3a3d75}
  .m-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .m-avatar{width:82px;height:82px;flex:none}
  .m-title h2{font-size:22px}
  .m-title .m-type{color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
  .m-title .m-group{color:var(--muted);font-size:12px;margin-top:2px}
  .lema{font-style:italic;color:#c8ccf2;margin:14px 0;font-size:15px;
        border-left:3px solid var(--accent);padding-left:12px}
  .desc{color:#d3d6f5;font-size:14.5px;line-height:1.6;margin-bottom:20px}

  .sec-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
             margin:18px 0 10px;font-weight:700}
  .trait{margin-bottom:12px}
  .trait .lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
  .trait .lbls b{color:var(--text)}
  .bar{height:9px;background:#2b2d5c;border-radius:999px;overflow:hidden;position:relative}
  .bar span{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:999px}
  .bar.right span{right:0}
  .bar.left span{left:0}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cols ul{list-style:none;font-size:13.5px}
  .cols li{padding:4px 0 4px 18px;position:relative;color:#d3d6f5;line-height:1.4}
  .cols li::before{position:absolute;left:0}
  .pos li::before{content:"✦";color:var(--diplomaticos)}
  .neg li::before{content:"•";color:#e07a7a}
  @media(max-width:480px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Personalidades del Grupo</h1>
    <p>Busca por nombre o filtra por grupo. Toca una tarjeta para ver los rasgos.</p>
  </header>

  <div class="controls">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9cdf5" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Buscar nombre… (p.ej. Sara, Nacho, Fer)">
    </div>
    <div class="chips" id="chips">
      <div class="chip active" data-g="all">Todos</div>
      <div class="chip" data-g="Analistas">Analistas</div>
      <div class="chip" data-g="Diplomáticos">Diplomáticos</div>
      <div class="chip" data-g="Centinelas">Centinelas</div>
      <div class="chip" data-g="Exploradores">Exploradores</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

    case "ESFP": // Animador - notas musicales + foco
      extra='<g fill="#2a2340"><g transform="translate(40,56)"><circle cx="0" cy="14" r="5"/><rect x="4" y="-2" width="2.4" height="16"/><path d="M6.4 -2 q10 2 8 10" stroke="#2a2340" stroke-width="2.4" fill="none"/></g>'
        +'<g transform="translate(146,62)"><circle cx="0" cy="12" r="4.4"/><rect x="3.4" y="-2" width="2.2" height="14"/></g></g>'
        +'<path d="M100 130 L70 176 L130 176Z" fill="#ffe27a" opacity=".18"/>';
      mouth='<path d="M86 99 Q100 113 114 99" stroke="#2a2340" stroke-width="3" fill="#fff" stroke-linecap="round"/>';
      hair='<path d="M64 82 Q66 40 100 40 Q134 40 136 82 Q130 58 100 58 Q70 58 64 82Z" fill="#2e2320"/>';
      break;
  }
  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'
    +bg+body+hair+face+mouth+extra+'</svg>';
}

let filterGroup="all", filterText="";

const grid=document.getElementById("grid");
function render(){
  const list=PEOPLE.filter(p=>{
    const c=TYPES[p.t];
    const okG=filterGroup==="all"||c.grupo===filterGroup;
    const okT=p.n.toLowerCase().includes(filterText)||c.nombre.toLowerCase().includes(filterText);
    return okG&&okT;
  });
  if(!list.length){grid.innerHTML='<div class="empty">Nadie coincide con esa búsqueda 🤔</div>';return;}
  grid.innerHTML=list.map((p,i)=>{
    const c=TYPES[p.t],col=COLORS[c.grupo];
    return `<div class="card" style="--accent:${col}" onclick="openModal('${p.n}')">
      ${PHOTOS[p.n]?`<img class="avatar-photo" src="${PHOTOS[p.n]}" alt="${p.n}">`:`<div class="avatar">${avatar(p.t)}</div>`}
      <div class="name">${p.n}</div>
      <div class="type">${c.nombre} · ${p.t}</div>
      <div class="badge">${c.grupo}</div>
    </div>`;
  }).join("");
}

function bar(k,v){
  const [left,right]=AXIS[k];
  // porcentaje hacia el lado del rasgo dominante (left)
  return `<div class="trait">
    <div class="lbls"><b>${left}</b><span>${right}</span></div>
    <div class="bar left"><span style="width:${v}%"></span></div>
  </div>`;
}

function openModal(name){
  const p=PEOPLE.find(x=>x.n===name),c=TYPES[p.t],col=COLORS[c.grupo];
  const bars=Object.entries(c.tr).map(([k,v])=>bar(k,v)).join("");
  document.getElementById("modal").innerHTML=`
    <button class="close" onclick="closeModal()">✕</button>
    <div class="m-head">
      ${PHOTOS[p.n]?`<img class="m-avatar-photo" style="border-color:${col}" src="${PHOTOS[p.n]}" alt="${p.n}">`:`<div class="m-avatar">${avatar(p.t)}</div>`}
      <div class="m-title">
        <h2>${p.n}</h2>
        <div class="m-type" style="color:${col}">${c.nombre} · ${p.t}</div>
        <div class="m-group">${c.grupo}</div>
      </div>
    </div>
    <div class="lema" style="border-color:${col}">“${c.lema}”</div>
    <div class="desc">${c.desc}</div>
    <div class="sec-title">Rasgos característicos</div>
    <div style="--accent:${col}">${bars}</div>
    <div class="sec-title">Fortalezas y puntos flacos</div>
    <div class="cols">
      <ul class="pos">${c.fort.map(f=>`<li>${f}</li>`).join("")}</ul>
      <ul class="neg">${c.debi.map(d=>`<li>${d}</li>`).join("")}</ul>
    </div>`;
  const ov=document.getElementById("overlay");
  ov.classList.add("open");document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow="";
}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

document.getElementById("search").addEventListener("input",e=>{filterText=e.target.value.toLowerCase().trim();render();});
document.getElementById("chips").addEventListener("click",e=>{
  if(!e.target.classList.contains("chip"))return;
  document.querySelectorAll(".chip").forEach(ch=>ch.classList.remove("active"));
  e.target.classList.add("active");
  filterGroup=e.target.dataset.g;render();
});

render();
